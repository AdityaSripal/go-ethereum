on:
  push:
    branches:
      - master
      - 'release-*'
  pull_request:
    branches:
      - master
      - 'release-*'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Build abigen
      run: go build -o ./build/bin/abigen ./cmd/abigen

    - name: Run linters
      run: |
        export PATH="$PWD/build/bin:$PATH"
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test

  windows:
    name: Windows ${{ matrix.arch }}
    needs: lint
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            msystem: MINGW64
            gcc-pkg: mingw-w64-x86_64-gcc
            mingw-subdir: mingw64
            test: true
          - arch: '386'
            msystem: MINGW32
            gcc-pkg: mingw-w64-i686-gcc
            mingw-subdir: mingw32
            test: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: ${{ matrix.gcc-pkg }}
          path-type: inherit

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        env:
          GETH_MINGW: ${{ steps.msys2.outputs.msys2-location }}\${{ matrix.mingw-subdir }}
        run: |
          set PATH=%GETH_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GETH_MINGW%\bin\gcc.exe

      - name: Run tests
        if: matrix.test
        shell: cmd
        env:
          GETH_MINGW: ${{ steps.msys2.outputs.msys2-location }}\${{ matrix.mingw-subdir }}
        run: |
          set PATH=%GETH_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GETH_MINGW%\bin\gcc.exe -short
